services:
  - type: web
    name: dbs-da3-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: NEO4J_URI
        value: neo4j+s://78fcafdc.databases.neo4j.io
      - key: NEO4J_USERNAME
        value: 78fcafdc
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        value: neo4j
